# Render Blueprint Specification for PramaanSetu
# One-click deployment with PostgreSQL 16 on Render (https://dashboard.render.com/)

services:
  - type: web
    name: pramaansetu
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pramaansetu-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: ENVIRONMENT
        value: production

databases:
  - name: pramaansetu-db
    databaseName: apaar_verification
    user: apaar_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

